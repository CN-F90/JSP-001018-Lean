name: Build JSP-001018 (Lean 4.34.0 + mathlib v4.34.0)

# Reproducible remote build of the JSP-001018 formalization.
# A green run proves: the pinned toolchain resolves, mathlib v4.34.0 builds,
# every module of the formalization compiles with no `sorry`/`admit`, and the
# axiom audit reports only Lean's standard foundations.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install elan and resolve the pinned toolchain
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm -f elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show versions
        run: |
          which lake && lake --version
          lean --version
          echo "lean-toolchain: $(cat lean-toolchain)"

      - name: Cache lake artifacts (best effort)
        uses: actions/cache@v4
        with:
          path: |
            .lake/build
            lake-packages
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain','lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-

      - name: lake update (fetch mathlib at the pinned commit)
        run: lake update

      - name: mathlib precompiled olean cache (best effort)
        continue-on-error: true
        run: lake exe cache get || echo "cache unavailable — will compile from source"

      - name: lake build
        run: lake build JSP001018 JSP001018.Axioms

      - name: Axiom audit (#print axioms)
        run: |
          echo "=== axiom audit: JSP001018.erdos_1213 and supporting lemmas ==="
          OUT=$(lake env lean JSP001018/Axioms.lean 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -q 'sorryAx'; then
            echo "ERROR: 'sorryAx' present — a 'sorry' remains in the proof."
            exit 1
          fi
          EXPECTED="'JSP001018.erdos_1213' depends on axioms: [propext, Classical.choice, Quot.sound]"
          if ! echo "$OUT" | grep -qF "$EXPECTED"; then
            echo "ERROR: unexpected axiom set for JSP001018.erdos_1213."
            exit 1
          fi
          echo "OK: main theorem depends only on [propext, Classical.choice, Quot.sound]."

      - name: Reject forbidden placeholders (sorry / admit / new axiom / unsafe)
        run: python3 scripts/check_no_placeholders.py

      - name: Confirm artifacts actually compiled (olean present)
        run: |
          # `JSP001018` is the root module of the library and `JSP001018.Axioms`
          # is a module inside it, so their oleans live under .lake/build/lib/lean/
          # as `JSP001018.olean` and `JSP001018/Axioms.olean` respectively.
          ok=1
          for m in "JSP001018.olean" "JSP001018/Axioms.olean"; do
            f=$(find .lake/build -path "*/lib/lean/$m" | head -1)
            if [ -n "$f" ] && [ -s "$f" ]; then
              echo "OK: $f built ($(stat -c%s "$f") bytes)."
            else
              echo "ERROR: $m NOT found under .lake/build/lib/lean/."
              echo "--- oleans actually produced ---"
              find .lake/build -name '*.olean' | sort || true
              ok=0
            fi
          done
          [ "$ok" = "1" ] || exit 1
